<!-- src/app/components/auth/login/login.component.html -->

<div class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full">
    <!-- Login Card -->
    <div class="bg-gray-800/50 backdrop-blur-sm rounded-2xl shadow-2xl border border-gray-700 overflow-hidden transform transition-all duration-500 hover:shadow-2xl">
      
      <!-- Card Header -->
      <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-8 py-8 text-center">
        <div class="mb-4">
          <div class="inline-flex items-center justify-center w-20 h-20 bg-white/10 rounded-2xl backdrop-blur-sm">
            <span class="text-4xl">🔐</span>
          </div>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">Task Manager</h1>
        <p class="text-indigo-100 text-sm">Welcome back! Please login to your account</p>
      </div>

      <!-- Card Body -->
      <div class="px-8 py-8">
        
        <!-- Error Message -->
        <div *ngIf="errorMessage" class="mb-6 animate-slideDown">
          <div class="bg-red-900/50 border-l-4 border-red-500 text-red-200 p-4 rounded-lg backdrop-blur-sm">
            <div class="flex items-center gap-3">
              <span class="text-xl">⚠️</span>
              <p class="font-medium text-sm">{{ errorMessage }}</p>
            </div>
          </div>
        </div>

        <!-- Login Form -->
        <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-6">
          
          <!-- Username Field -->
          <div class="space-y-2">
            <label for="username" class="block text-sm font-semibold text-gray-300">
              Username
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
              </div>
              <input
                type="text"
                id="username"
                class="w-full pl-10 pr-4 py-3 bg-gray-700/50 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-gray-100 placeholder-gray-500 transition-all duration-200"
                [class.border-red-500]="loginForm.submitted && !loginData.username"
                [(ngModel)]="loginData.username"
                name="username"
                placeholder="Enter your username"
                required
                autocomplete="username"
              />
            </div>
            <div *ngIf="loginForm.submitted && !loginData.username" class="text-xs text-red-400 flex items-center gap-1">
              <span>⚠️</span> Username is required
            </div>
          </div>

          <!-- Password Field -->
          <div class="space-y-2">
            <label for="password" class="block text-sm font-semibold text-gray-300">
              Password
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6-4h12a2 2 0 012 2v6a2 2 0 01-2 2H6a2 2 0 01-2-2v-6a2 2 0 012-2zm10-4V8a4 4 0 00-8 0v3h8z"></path>
                </svg>
              </div>
              <input
                type="password"
                id="password"
                class="w-full pl-10 pr-4 py-3 bg-gray-700/50 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-gray-100 placeholder-gray-500 transition-all duration-200"
                [class.border-red-500]="loginForm.submitted && !loginData.password"
                [(ngModel)]="loginData.password"
                name="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              />
              <button 
                type="button"
                class="absolute inset-y-0 right-0 pr-3 flex items-center"
                onclick="this.previousElementSibling.type = this.previousElementSibling.type === 'password' ? 'text' : 'password'">
                <svg class="h-5 w-5 text-gray-500 hover:text-gray-400 cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              </button>
            </div>
            <div *ngIf="loginForm.submitted && !loginData.password" class="text-xs text-red-400 flex items-center gap-1">
              <span>⚠️</span> Password is required
            </div>
          </div>

          <!-- Submit Button -->
          <button 
            type="submit" 
            class="w-full px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold rounded-lg transition-all duration-200 transform hover:scale-[1.02] shadow-lg hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-gray-800 disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="loading || !loginForm.form.valid">
            <span *ngIf="!loading" class="flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
              </svg>
              Login
            </span>
            <span *ngIf="loading" class="flex items-center justify-center gap-2">
              <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Logging in...
            </span>
          </button>
        </form>

        <!-- Register Link -->
        <div class="mt-8 text-center">
          <p class="text-gray-400 text-sm">
            Don't have an account? 
            <a routerLink="/register" class="text-indigo-400 hover:text-indigo-300 font-semibold transition-colors duration-200 ml-1">
              Register here
              <span aria-hidden="true">→</span>
            </a>
          </p>
        </div>

        <!-- Demo Credentials Hint (Optional) -->
        <div class="mt-6 pt-6 border-t border-gray-700">
          <div class="bg-gray-700/30 rounded-lg p-3">
            <p class="text-xs text-gray-500 text-center">
              <span class="font-semibold">💡 Demo Credentials:</span><br>
              Username: <span class="text-gray-400 font-mono">demo</span> | 
              Password: <span class="text-gray-400 font-mono">password</span>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  @keyframes slideDown {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  
  .animate-slideDown {
    animation: slideDown 0.3s ease-out;
  }
</style>
