<!-- src/app/components/auth/register/register.component.html -->

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>📝 Create Account</h1>
      <p>Join Task Manager today!</p>
    </div>

    <!-- Success Message -->
    <div class="alert alert-success" *ngIf="successMessage">
      ✅ {{ successMessage }}
    </div>

    <!-- Error Message -->
    <div class="alert alert-danger" *ngIf="errorMessage">
      ⚠️ {{ errorMessage }}
    </div>

    <!-- Register Form -->
    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      
      <!-- Full Name Field -->
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          class="form-control"
          [(ngModel)]="registerData.fullName"
          name="fullName"
          placeholder="Enter your full name"
          required
          autocomplete="name"
        />
      </div>

      <!-- Username Field -->
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          class="form-control"
          [(ngModel)]="registerData.username"
          name="username"
          placeholder="Choose a username"
          required
          autocomplete="username"
        />
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          class="form-control"
          [(ngModel)]="registerData.email"
          name="email"
          placeholder="Enter your email"
          required
          autocomplete="email"
        />
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          class="form-control"
          [(ngModel)]="registerData.password"
          name="password"
          placeholder="Create a password (min 6 characters)"
          required
          autocomplete="new-password"
        />
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading || !registerForm.form.valid">
        <span *ngIf="!loading">Register</span>
        <span *ngIf="loading">
          <span class="spinner"></span> Creating account...
        </span>
      </button>
    </form>

    <!-- Login Link -->
    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Login here</a></p>
    </div>
  </div>
</div>
